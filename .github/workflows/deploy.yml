name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js for build
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify build output
        working-directory: frontend
        run: ls -la dist/

      - name: Prepare EC2 Directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🛠️ Preparing deployment directory..."
            sudo mkdir -p /var/www/frontend
            sudo chown -R $USER:$USER /var/www/frontend
            sudo chmod -R 775 /var/www/frontend
            ls -la /var/www/frontend

      - name: Upload Frontend Build
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/dist/**"
          target: "/var/www/frontend"
          strip_components: 1
          overwrite: true

      - name: Set Final Permissions
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🔒 Setting final permissions..."
            sudo chown -R www-data:www-data /var/www/frontend
            sudo chmod -R 755 /var/www/frontend

      - name: Deploy Backend & Configure Nginx
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🚀 Starting full deployment..."
            
            # Install dependencies
            sudo apt update
            sudo apt install -y nginx docker.io
            
            # Configure Nginx
            sudo tee /etc/nginx/sites-available/ecommerce > /dev/null <<'EOF'
            server {
              listen 80;
              server_name ${{ secrets.DOMAIN || '$host' }};
              
              root /var/www/frontend;
              index index.html;
              
              location / {
                try_files $uri $uri/ /index.html;
              }
              
              location /api/ {
                proxy_pass http://localhost:3000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
                proxy_set_header X-Real-IP $remote_addr;
              }
            }
            EOF
            
            # Enable Nginx config
            sudo ln -sf /etc/nginx/sites-available/ecommerce /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl restart nginx
            
            # Deploy backend container
            sudo docker stop backend || true
            sudo docker rm backend || true
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest
            
            sudo docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e BIND_ADDRESS=0.0.0.0 \
              -e PORT=3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest
            
            # Verify deployment
            echo "🔄 Checking services..."
            sleep 10  # Wait for services to start
            
            echo "🔍 Nginx status:"
            sudo systemctl status nginx --no-pager
            
            echo "🔍 Backend container status:"
            sudo docker ps -a | grep backend
            
            echo "✅ Deployment complete!"
name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js for build
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload Frontend Build to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/build/*"
          target: "/var/www/frontend"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "✅ Logging into EC2 and starting deployment..."

            # Install NGINX if not already
            sudo apt update && sudo apt install -y nginx

            # Setup NGINX config for frontend + reverse proxy
            sudo tee /etc/nginx/sites-available/ecommerce > /dev/null <<EOF
            server {
              listen 80;

              root /var/www/frontend;
              index index.html;

              location / {
                try_files \$uri /index.html;
              }

              location /api/ {
                proxy_pass http://localhost:3000/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection keep-alive;
                proxy_set_header Host \$host;
                proxy_cache_bypass \$http_upgrade;
              }
            }
            EOF

            # Enable site and restart NGINX
            sudo ln -sf /etc/nginx/sites-available/ecommerce /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl restart nginx

            # Stop and remove backend container if running
            sudo docker stop backend || true
            sudo docker rm backend || true

            # Pull latest backend image
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest

            # Run backend container (port 3000)
            sudo docker run -d \
              --name backend \
              -p 3000:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest

name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "✅ Logging into EC2 and starting deployment..."

            # Stop and remove existing containers if running
            sudo docker stop frontend || true
            sudo docker rm frontend || true
            sudo docker stop backend || true
            sudo docker rm backend || true

            # Pull latest images from Docker Hub
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-frontend:latest
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest

            # Run backend container
            sudo docker run -d \
              --name backend \
              -p 3000:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest

            # Run frontend container
            sudo docker run -d \
              --name frontend \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-frontend:latest

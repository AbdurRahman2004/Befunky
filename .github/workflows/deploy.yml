name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js for build
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify build output
        working-directory: frontend
        run: ls -la dist/

      - name: Upload Frontend Build to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/dist/**"  # Double asterisk for recursive copy
          target: "/var/www/frontend"
          strip_components: 1
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "✅ Starting deployment..."
            
            # Install dependencies
            sudo apt update
            sudo apt install -y nginx docker.io
            
            # Configure frontend directory
            sudo mkdir -p /var/www/frontend
            sudo chown -R ubuntu:ubuntu /var/www/frontend
            sudo chmod -R 755 /var/www/frontend
            
            # Configure Nginx
            sudo tee /etc/nginx/sites-available/ecommerce > /dev/null <<EOF
            server {
              listen 80;
              server_name ${{ secrets.DOMAIN || 'localhost' }};
              
              root /var/www/frontend;
              index index.html;
              
              location / {
                try_files \$uri \$uri/ /index.html;
              }
              
              location /api/ {
                proxy_pass http://localhost:3000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host \$host;
                proxy_cache_bypass \$http_upgrade;
                proxy_set_header X-Real-IP \$remote_addr;
              }
            }
            EOF
            
            # Enable Nginx config
            sudo ln -sf /etc/nginx/sites-available/ecommerce /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl restart nginx
            
            # Deploy backend container with explicit 0.0.0.0 binding
            sudo docker stop backend || true
            sudo docker rm backend || true
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest
            
            sudo docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e BIND_ADDRESS=0.0.0.0 \  # Critical fix
              -e PORT=3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest
            
            # Verify deployment
            echo "🔄 Checking backend health..."
            sleep 10  # Wait for container to start
            curl -v http://localhost:3000/api/health || echo "Backend health check failed"
            
            echo "🚀 Deployment complete!"
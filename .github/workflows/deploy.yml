name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Frontend Build
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: '/api'  # Critical for production API paths

      # Backend Deployment
      - name: Deploy Backend Container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Stop and clean existing container
            sudo docker stop backend || true
            sudo docker rm backend || true
            
            # Pull latest backend image
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest
            
            # Run with production config
            sudo docker run -d \
              --name backend \
              --restart unless-stopped \
              --network host \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e BIND_ADDRESS=0.0.0.0 \
              -e CORS_ORIGIN="http://${{ secrets.DOMAIN }},http://${{ secrets.EC2_HOST }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest

      # Frontend Deployment
      - name: Deploy Frontend Files
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/dist/**"
          target: "/var/www/frontend"
          overwrite: true
          strip_components: 0

      # Server Configuration
      - name: Configure Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Set permissions
            sudo chown -R www-data:www-data /var/www/frontend
            sudo find /var/www/frontend -type d -exec chmod 755 {} \;
            sudo find /var/www/frontend -type f -exec chmod 644 {} \;
            
            # Configure Nginx
            sudo tee /etc/nginx/sites-available/ecommerce > /dev/null <<'EOF'
            server {
                listen 80;
                server_name ${{ secrets.DOMAIN }} ${{ secrets.EC2_HOST }};
                
                root /var/www/frontend;
                index index.html;
                
                location / {
                    try_files $uri $uri/ /index.html;
                    add_header Cache-Control "no-cache";
                }
                
                location /api/ {
                    proxy_pass http://127.0.0.1:3000/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_cache_bypass $http_upgrade;
                }
                
                location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }
            }
            EOF
            
            # Enable configuration
            sudo ln -sf /etc/nginx/sites-available/ecommerce /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl restart nginx

      # Verification
      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🔄 Running health checks..."
            
            # Backend direct check
            echo "Backend (Direct):"
            curl -v http://localhost:3000/api/health || exit 1
            
            # Frontend check
            echo "Frontend:"
            curl -v http://localhost | grep -q "Loading..." || exit 1
            
            # Proxy check
            echo "API Proxy:"
            curl -v http://localhost/api/health || exit 1
            
            echo "✅ All systems operational!"